<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一起成事 — 实时匹配志同道合的同事，一起把事做成。选择你的目标，自动匹配伙伴，立刻开始行动。" />
    <meta name="theme-color" content="#16a085" />
    <meta property="og:title" content="一起成事 | Build Together" />
    <meta property="og:description" content="实时匹配同事，一起做伟大的事情" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://matafyan.github.io/tongshi/" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤝</text></svg>" />
    <title>一起成事 | 实时匹配同事</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">GO</div>
          <div>
            <h1 data-i18n="brandTitle">一起成事</h1>
            <p data-i18n="brandSubtitle">实时匹配同事，一起做伟大的事情</p>
          </div>
        </div>

        <a class="contact-link" href="mailto:matafyan@qq.com" data-i18n="contact">想一起做伟大的事，联系 matafyan@qq.com</a>

        <div class="topbar-actions">
          <div class="language-toggle" aria-label="Language switcher">
            <button class="lang-button active" type="button" data-lang="zh">中</button>
            <button class="lang-button" type="button" data-lang="en">EN</button>
          </div>

          <div class="metrics" aria-label="实时状态">
            <div>
              <strong id="onlineCount">0</strong>
              <span data-i18n="online">在线</span>
            </div>
            <div>
              <strong id="matchCount">0</strong>
              <span data-i18n="collaborators">可协作</span>
            </div>
          </div>
        </div>
      </header>

      <main class="page">
        <!-- Step indicator -->
        <div id="stepIndicator" class="step-indicator" aria-label="步骤导航">
          <div class="step active" data-step="0">
            <span class="step-num">1</span>
            <span class="step-label" data-i18n="stepDefine">定义目标</span>
          </div>
          <div class="step-connector"></div>
          <div class="step" data-step="1">
            <span class="step-num">2</span>
            <span class="step-label" data-i18n="stepMatch">寻找伙伴</span>
          </div>
          <div class="step-connector"></div>
          <div class="step" data-step="2">
            <span class="step-num">3</span>
            <span class="step-label" data-i18n="stepCollaborate">一起成事</span>
          </div>
        </div>

        <!-- Step 1: Intent Form -->
        <section class="intent-panel" aria-label="发布协作意图" id="stepPanel0">
          <div class="section-head">
            <div>
              <span data-i18n="currentIntent">当前想做</span>
              <h2 data-i18n="publishThing">发布一件要做成的事</h2>
            </div>
            <button id="rerollName" class="ghost-button" type="button" data-i18n="randomName">随机昵称</button>
          </div>

          <form id="intentForm" class="intent-form">
            <label>
              <span data-i18n="alias">昵称</span>
              <input id="aliasInput" type="text" maxlength="12" autocomplete="off" placeholder="" />
            </label>

            <label>
              <span data-i18n="direction">方向</span>
              <select id="categorySelect"></select>
            </label>

            <label>
              <span data-i18n="thing">这件事</span>
              <select id="merchantSelect"></select>
            </label>

            <label>
              <span data-i18n="time">投入时间</span>
              <select id="budgetSelect"></select>
            </label>

            <label>
              <span data-i18n="team">团队/地点</span>
              <select id="locationSelect"></select>
            </label>

            <label>
              <span data-i18n="visibility">可见范围</span>
              <select id="visibilitySelect"></select>
            </label>

            <label>
              <span data-i18n="needed">还差同事</span>
              <input id="neededInput" min="1" max="4" step="1" type="number" />
            </label>

            <fieldset>
              <legend data-i18n="neededSkills">需要能力</legend>
              <div id="preferenceOptions" class="chip-row"></div>
            </fieldset>

            <fieldset>
              <legend data-i18n="signals">行动信号</legend>
              <div id="tagOptions" class="chip-row"></div>
            </fieldset>

            <div class="switch-row">
              <span data-i18n="startToday">今天能开始</span>
              <label class="switch" aria-label="今天是否可以开始">
                <input id="pickupToggle" type="checkbox" />
                <span></span>
              </label>
            </div>

            <label>
              <span data-i18n="expectedResponse">期望响应</span>
              <div class="range-row">
                <input id="waitInput" min="10" max="90" step="5" type="range" />
                <output id="waitOutput">20s</output>
              </div>
            </label>

            <button class="primary-button" type="submit" data-i18n="startMatching">开始匹配同事</button>
          </form>
        </section>

        <!-- Step 2: Matching (shown after publishing) -->
        <section class="match-panel" aria-label="实时匹配同事列表" id="stepPanel1" style="display:none">
          <div class="section-head">
            <div>
              <span data-i18n="realtimeMatch">实时匹配</span>
              <h2 data-i18n="matchHeading">能一起推进的同事</h2>
            </div>
            <strong id="publishState" class="state-pill" data-i18n="published">实时匹配中</strong>
          </div>

          <!-- Loading state -->
          <div id="loadingState" class="loading-state" style="display:none">
            <div class="spinner"></div>
            <p data-i18n="findingPartner">正在为你寻找合适的同事...</p>
            <p class="loading-sub" data-i18n="loadingSub">通常只需几秒</p>
          </div>

          <div id="matchList" class="match-list"></div>
        </section>

        <!-- Step 3: Connected state -->
        <section class="connected-panel" id="stepPanel2" style="display:none" aria-label="已连接">
          <div class="connected-hero">
            <div class="connected-icon">🤝</div>
            <h2 data-i18n="connectedTitle">已连接！</h2>
            <p id="connectedWith" class="connected-text"></p>
            <p class="connected-sub" data-i18n="connectedSub">现在可以一起把事做成了</p>
          </div>

          <div class="connected-actions">
            <button id="startTimerBtn" class="primary-button" type="button" data-i18n="startFocusTimer">开始 25 分钟专注</button>
            <button id="newMatchBtn" class="ghost-button" type="button" data-i18n="findAnother">找另一个伙伴</button>
          </div>

          <!-- Focus timer -->
          <div id="focusTimer" class="focus-timer" style="display:none">
            <div class="timer-display">
              <span id="timerMinutes">25</span>:<span id="timerSeconds">00</span>
            </div>
            <p class="timer-label" data-i18n="focusLabel">专注中，一起加油</p>
            <button id="pauseTimerBtn" class="ghost-button" type="button" data-i18n="pause">暂停</button>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
