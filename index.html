<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>一起成事 | 实时匹配同事</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">GO</div>
          <div>
            <h1 data-i18n="brandTitle">一起成事</h1>
            <p data-i18n="brandSubtitle">实时匹配同事，一起做伟大的事情</p>
          </div>
        </div>

        <a class="contact-link" href="mailto:matafyan@qq.com" data-i18n="contact">想一起做伟大的事，联系 matafyan@qq.com</a>

        <div class="language-toggle" aria-label="Language switcher">
          <button class="lang-button active" type="button" data-lang="zh">中</button>
          <button class="lang-button" type="button" data-lang="en">EN</button>
        </div>

        <div class="metrics" aria-label="实时状态">
          <div>
            <strong id="onlineCount">0</strong>
            <span data-i18n="online">在线</span>
          </div>
          <div>
            <strong id="matchCount">0</strong>
            <span data-i18n="collaborators">可协作</span>
          </div>
          <div>
            <strong id="bestScore">0%</strong>
            <span data-i18n="bestMatch">最高匹配</span>
          </div>
        </div>
      </header>

      <main class="page">
        <section class="intent-panel" aria-label="发布协作意图">
          <div class="section-head">
            <div>
              <span data-i18n="currentIntent">当前想做</span>
              <h2 data-i18n="publishThing">发布一件要做成的事</h2>
            </div>
            <button id="rerollName" class="ghost-button" type="button" data-i18n="randomName">随机昵称</button>
          </div>

          <form id="intentForm" class="intent-form">
            <label>
              <span data-i18n="alias">昵称</span>
              <input id="aliasInput" type="text" maxlength="12" autocomplete="off" />
            </label>

            <label>
              <span data-i18n="direction">方向</span>
              <select id="categorySelect"></select>
            </label>

            <label>
              <span data-i18n="thing">这件事</span>
              <select id="merchantSelect"></select>
            </label>

            <label>
              <span data-i18n="time">投入时间</span>
              <select id="budgetSelect"></select>
            </label>

            <label>
              <span data-i18n="team">团队/地点</span>
              <select id="locationSelect"></select>
            </label>

            <label>
              <span data-i18n="visibility">可见范围</span>
              <select id="visibilitySelect"></select>
            </label>

            <label>
              <span data-i18n="needed">还差同事</span>
              <input id="neededInput" min="1" max="4" step="1" type="number" />
            </label>

            <fieldset>
              <legend data-i18n="neededSkills">需要能力</legend>
              <div id="preferenceOptions" class="chip-row"></div>
            </fieldset>

            <fieldset>
              <legend data-i18n="signals">行动信号</legend>
              <div id="tagOptions" class="chip-row"></div>
            </fieldset>

            <div class="switch-row">
              <span data-i18n="startToday">今天能开始</span>
              <label class="switch" aria-label="今天是否可以开始">
                <input id="pickupToggle" type="checkbox" />
                <span></span>
              </label>
            </div>

            <label>
              <span data-i18n="expectedResponse">期望响应</span>
              <div class="range-row">
                <input id="waitInput" min="10" max="90" step="5" type="range" />
                <output id="waitOutput">20s</output>
              </div>
            </label>

            <button class="primary-button" type="submit" data-i18n="startMatching">开始匹配同事</button>
          </form>
        </section>

        <section class="match-panel" aria-label="实时匹配同事列表">
          <div class="section-head">
            <div>
              <span data-i18n="realtimeMatch">实时匹配</span>
              <h2 data-i18n="matchHeading">能一起推进的同事</h2>
            </div>
            <strong id="publishState" class="state-pill" data-i18n="unpublished">未发布</strong>
          </div>

          <div id="matchList" class="match-list"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
